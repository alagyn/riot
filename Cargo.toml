[package]
name = "riot"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = {version = "0.13.4", features = ["json", "blocking"]}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"
tokio = {version = "1.52.3", features = ["rt-multi-thread"]}
axum = {version = "0.8.9", default-features = false, features = ["http1", "http2",  "json", "tokio"]}
axum-server = {version = "0.8.0", features = ["tls-rustls"]}
axum-server-mtls = "0.1.2"
chrono = "0.4.45"
regex = "1.13.1"
rustls = "0.23.43"
rcgen = {version = "0.14.10", features = ['pem', 'x509-parser']}

[lib]
name = "riot"
path = "src/riot.rs"

[[bin]]
name = "riotd"
path = "src/bin/riotd.rs"

[[bin]]
name = "riotctl"
path = "src/bin/riotctl.rs"
